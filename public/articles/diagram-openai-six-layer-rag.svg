<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="to1 do1">
  <title id="to1">OpenAI 6層コンテキストの全体像</title>
  <desc id="do1">ユーザーの質問がデータエージェントに入り、Layer 1-3 と Layer 4-6 が接続。日次パイプラインがベクトル化して RAG で検索する</desc>
  <rect width="720" height="340" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#0f172a">6層コンテキストの全体像</text>
  <g font-family="system-ui,sans-serif">
    <rect x="272" y="48" width="176" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="360" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">ユーザーの質問</text>

    <rect x="252" y="128" width="216" height="60" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <text x="360" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">GPT-5.2 データエージェント</text>
    <text x="360" y="172" text-anchor="middle" font-size="11" fill="#475569">6層すべてを参照して回答</text>

    <text x="118" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0284c7">Layer 1-3</text>
    <rect x="24" y="116" width="188" height="30" rx="7" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="118" y="136" text-anchor="middle" font-size="11.5" fill="#0f172a">L1 Table Usage</text>
    <rect x="24" y="152" width="188" height="30" rx="7" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="118" y="172" text-anchor="middle" font-size="11.5" fill="#0f172a">L2 Human Annotations</text>
    <rect x="24" y="188" width="188" height="30" rx="7" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="118" y="208" text-anchor="middle" font-size="11.5" fill="#0f172a">L3 Codex Enrichment</text>

    <text x="602" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed">Layer 4-6</text>
    <rect x="508" y="116" width="188" height="30" rx="7" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="602" y="136" text-anchor="middle" font-size="11.5" fill="#0f172a">L4 Institutional Knowledge</text>
    <rect x="508" y="152" width="188" height="30" rx="7" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="602" y="172" text-anchor="middle" font-size="11.5" fill="#0f172a">L5 Memory</text>
    <rect x="508" y="188" width="188" height="30" rx="7" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="602" y="208" text-anchor="middle" font-size="11.5" fill="#0f172a">L6 Runtime Context</text>

    <g stroke="#94a3b8" stroke-width="1.8" fill="none">
      <path d="M360 82 L360 126" marker-end="url(#ao1)"/>
      <path d="M212 131 L250 145" marker-end="url(#ao1)"/>
      <path d="M212 167 L250 160" marker-end="url(#ao1)"/>
      <path d="M212 203 L250 176" marker-end="url(#ao1)"/>
      <path d="M508 131 L470 145" marker-end="url(#ao1)"/>
      <path d="M508 167 L470 160" marker-end="url(#ao1)"/>
      <path d="M508 203 L470 176" marker-end="url(#ao1)"/>
    </g>

    <rect x="132" y="244" width="456" height="46" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="360" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">日次パイプライン</text>
    <text x="360" y="282" text-anchor="middle" font-size="11" fill="#78350f">Embeddings API でベクトル化 → RAG で検索</text>
    <path d="M360 244 L360 194" stroke="#f59e0b" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#ao2)"/>

    <text x="360" y="316" text-anchor="middle" font-size="10.5" fill="#94a3b8">出典: Inside OpenAI's in-house data agent（記事内 primarySources 参照）</text>
