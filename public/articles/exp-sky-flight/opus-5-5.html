<title>exp-claude-opus-5-5-run1</title>
<style>
/* Layout: one cinematic 16:9 stage, a thin transport bar beneath it. Single dark look (a screening room). */
:root{
  --bg:#0b0f1a; --panel:#131a2a; --fg:#e7eaf3; --muted:#8b94ad; --accent:#f2b56b; --line:#243049;
  --font-ui: "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  --font-mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{padding-inline:16px;padding-block:20px;font:14px/1.5 var(--font-ui)}
.stage{max-width:1280px;margin:0 auto;display:grid;gap:12px}
canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:16/9;border-radius:6px;background:#000}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;min-width:88px}
.bar button:hover{border-color:var(--accent)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.tc{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
</style>
<main class="stage">
  <canvas id="c" width="1280" height="720" aria-label="鶴に乗って四季の空を飛ぶ40秒のアニメーション"></canvas>
  <div class="bar">
    <button id="play" type="button">一時停止</button>
    <input id="scrub" type="range" min="0" max="40" step="0.01" value="0" aria-label="再生位置（秒）">
    <span class="tc" id="tc">00.00 / 40.00</span>
  </div>
</main>
<script>
(function(){
"use strict";
const W=1280,H=720,D=40,TAU=Math.PI*2;
window.__duration=D;

/* ---------- math & deterministic randomness ---------- */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k);};
const bump=(t,c,w)=>{const k=1-Math.abs(t-c)/w;return k<=0?0:k*k*(3-2*k);};
const fract=x=>x-Math.floor(x);
const hash=n=>fract(Math.sin(n*127.1+17.13)*43758.5453123);
const h2=(i,s)=>hash(i*1.0001+s*1013.7);
function noise(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(h2(i,s),h2(i+1,s),u);}
function fbm(x,s){let v=0,a=.5,f=1;for(let o=0;o<4;o++){v+=a*noise(x*f,s+o*7);f*=2.03;a*=.5;}return v/.9375;}
function ridged(x,s){let v=0,a=.55,f=1;for(let o=0;o<4;o++){const n=1-Math.abs(noise(x*f,s+o*5)*2-1);v+=a*n*n;f*=2.1;a*=.45;}return v/.9;}
const wrap=(x,m)=>((x%m)+m)%m;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(20260930);

/* ---------- color ---------- */
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const WHITE=[255,255,255],BLACK=[0,0,0];
const dark=(c,k)=>mix(c,BLACK,k), lite=(c,k)=>mix(c,WHITE,k);

/* ---------- season palette keyframes (time -> look) ---------- */
const KEYS=[
 {t:0, skyTop:[118,168,228],skyMid:[196,210,240],skyBot:[255,226,234],haze:[236,220,236],sun:[255,244,225],sunX:1010,sunY:150,sunA:.9,light:[255,226,236],lightA:.12,veg:[255,184,208],vegDark:[222,128,160],ground:[140,186,112],water:[120,170,210],night:0,moonA:0},
 {t:8.5},
 {t:12,skyTop:[38,116,214],skyMid:[112,178,240],skyBot:[196,230,255],haze:[176,212,242],sun:[255,252,236],sunX:760,sunY:95,sunA:1,light:[255,250,225],lightA:.06,veg:[76,156,64],vegDark:[34,98,48],ground:[92,158,72],water:[30,110,180]},
 {t:19,sunX:820,sunY:130,skyBot:[206,232,252]},
 {t:23,skyTop:[70,100,180],skyMid:[184,164,192],skyBot:[255,200,150],haze:[235,195,165],sun:[255,215,150],sunX:880,sunY:250,light:[255,205,150],lightA:.18,veg:[226,160,52],vegDark:[170,90,30],ground:[176,140,72],water:[60,100,150]},
 {t:28,skyTop:[52,50,112],skyMid:[176,98,122],skyBot:[255,146,88],haze:[205,128,118],sun:[255,160,90],sunX:800,sunY:470,light:[255,150,95],lightA:.28,veg:[214,72,42],vegDark:[128,38,32],ground:[120,78,50],water:[70,60,100]},
 {t:31,skyTop:[40,48,88],skyMid:[112,112,148],skyBot:[172,166,186],haze:[152,160,186],sun:[240,220,220],sunX:780,sunY:640,sunA:0,light:[190,200,235],lightA:.18,veg:[232,236,246],vegDark:[140,152,182],ground:[218,226,240],water:[60,70,100],night:.3,moonA:.2},
 {t:35,skyTop:[10,18,50],skyMid:[30,45,95],skyBot:[62,82,130],haze:[72,92,138],light:[150,170,230],lightA:.3,night:1,moonA:1},
 {t:40,skyTop:[6,12,36],skyMid:[24,36,82],skyBot:[52,70,118],haze:[62,80,125]}
];
for(let i=1;i<KEYS.length;i++){for(const k in KEYS[i-1]) if(!(k in KEYS[i])) KEYS[i][k]=KEYS[i-1][k];}
function palette(t){
  let i=0; while(i<KEYS.length-2 && t>=KEYS[i+1].t) i++;
  const a=KEYS[i],b=KEYS[i+1],k=sstep(0,1,(t-a.t)/(b.t-a.t)),P={};
  for(const key in a){ if(key==='t')continue; const va=a[key],vb=b[key]; P[key]=Array.isArray(va)?mix(va,vb,k):lerp(va,vb,k); }
  return P;
}

/* camera travel: constant speed, easing to a slow glide over the last 5 s */
function camT(t){ if(t<=35) return t; const u=(t-35)/5; return 35+5*(u-.72*(u*u*u-u*u*u*u/2)); }

/* ---------- canvases ---------- */
const main=document.getElementById('c');
const ctx=main.getContext('2d');
const layer=document.createElement('canvas'); layer.width=W; layer.height=H;
const lctx=layer.getContext('2d');
const HW=640,HH=460;
const heroC=document.createElement('canvas'); heroC.width=HW; heroC.height=HH;
const hctx=heroC.getContext('2d');
let X=ctx; // current drawing target for scene functions

function circle(x,y,r){X.beginPath();X.arc(x,y,r,0,TAU);X.fill();}
function ridgePath(fn,step=8){X.beginPath();X.moveTo(-10,H+10);for(let x=-10;x<=W+10;x+=step)X.lineTo(x,fn(x));X.lineTo(W+10,H+10);X.closePath();}

/* ---------- reusable scenery pieces ---------- */
function cloudRow(scroll,spacing,yBase,amp,rMin,rMax,seed,light,shade){
  const k0=Math.floor(scroll/spacing)-3,k1=k0+Math.ceil(W/spacing)+6;
  X.fillStyle=rgb(shade); X.fillRect(0,yBase,W,H-yBase+2);
  for(let pass=0;pass<2;pass++){
    X.fillStyle=rgb(pass?light:shade);
    for(let k=k0;k<=k1;k++){
      const x=k*spacing-scroll+(h2(k,seed)-.5)*spacing*.6;
      const r=lerp(rMin,rMax,h2(k,seed+1)), y=yBase-h2(k,seed+2)*amp;
      if(pass) circle(x-r*.08,y-r*.2,r*.8); else circle(x,y,r);
    }
  }
}
function roundTree(x,y,sz,col,colD,seed){
  X.fillStyle=rgb(dark(colD,.45)); X.fillRect(x-sz*.07,y-sz*.55,sz*.14,sz*.6);
  X.fillStyle=rgb(colD);
  circle(x-sz*.28,y-sz*.62,sz*.36); circle(x+sz*.3,y-sz*.6,sz*.34); circle(x,y-sz*.9,sz*.42);
  X.fillStyle=rgb(col);
  circle(x-sz*.22,y-sz*.72,sz*.27); circle(x+sz*.24,y-sz*.72,sz*.25); circle(x-sz*.02,y-sz*1.0,sz*.32);
  X.fillStyle=rgb(lite(col,.25)); circle(x-sz*.08+h2(seed,3)*4,y-sz*1.1,sz*.14);
}
function pine(x,y,h,col,snowK){
  const w=h*.42;
  for(let i=0;i<3;i++){
    const top=y-h+i*h*.26, bw=w*(.55+i*.25), bh=h*.42;
    X.fillStyle=rgb(col); X.beginPath(); X.moveTo(x,top); X.lineTo(x+bw,top+bh); X.lineTo(x-bw,top+bh); X.closePath(); X.fill();
    if(snowK>0){ X.fillStyle=rgb([236,242,252],snowK); X.beginPath(); X.moveTo(x,top); X.lineTo(x+bw*.62,top+bh*.55); X.quadraticCurveTo(x,top+bh*.4,x-bw*.62,top+bh*.55); X.closePath(); X.fill(); }
  }
  X.fillStyle=rgb(dark(col,.4)); X.fillRect(x-h*.035,y-h*.06,h*.07,h*.1);
}
function gull(x,y,s,ph,col){
  const f=Math.sin(ph)*s*.5;
  X.strokeStyle=rgb(col); X.lineWidth=Math.max(1,s*.12); X.lineCap='round';
  X.beginPath(); X.moveTo(x-s,y-f); X.quadraticCurveTo(x-s*.45,y-s*.35-f*.3,x,y); X.quadraticCurveTo(x+s*.45,y-s*.35-f*.3,x+s,y-f); X.stroke();
}

/* ---------- scene 1: sea of clouds with floating islands (spring morning) ---------- */
function island(x,y,s,P,d,seed){
  const rock=mix([128,104,100],P.haze,d), grass=mix(P.ground,P.haze,d);
  const g=X.createLinearGradient(0,y,0,y+160*s); g.addColorStop(0,rgb(rock)); g.addColorStop(1,rgb(dark(rock,.35)));
  X.fillStyle=g; X.beginPath(); X.moveTo(x-115*s,y);
  X.bezierCurveTo(x-90*s,y+70*s,x-30*s,y+90*s,x+8*s,y+165*s);
  X.bezierCurveTo(x+40*s,y+80*s,x+95*s,y+60*s,x+115*s,y); X.closePath(); X.fill();
  X.fillStyle=rgb(grass); X.beginPath(); X.ellipse(x,y,118*s,15*s,0,0,TAU); X.fill();
  const wf=X.createLinearGradient(0,y,0,y+240*s); wf.addColorStop(0,rgb(lite(P.haze,.6),.8)); wf.addColorStop(1,rgb(lite(P.haze,.6),0));
  X.fillStyle=wf; X.fillRect(x+68*s,y+2,6*s,240*s);
  const veg=mix(P.veg,P.haze,d*.8), vegD=mix(P.vegDark,P.haze,d*.8);
  for(let i=0;i<4;i++){ roundTree(x+(-75+i*48+(h2(seed,i)-.5)*16)*s,y+2*s,(34+h2(seed,i+9)*18)*s,veg,vegD,seed+i); }
}
function sceneClouds(t,P,s){
  const white=lite(P.skyBot,.55), shadeBase=mix([196,200,228],P.haze,.5);
  const L=[[8,430,30,70,30,60,1,.75],[26,488,40,95,40,80,2,.5],[70,572,55,130,55,100,3,.28],[180,672,60,170,70,130,4,.06]];
  L.forEach((l,idx)=>{
    const [sp,y,amp,spc,r0,r1,seed,d]=l;
    cloudRow(s*sp,spc,y,amp,r0,r1,seed,mix(white,P.haze,d*.6),mix(shadeBase,P.haze,d*.6));
    if(idx===0||idx===1){
      const isp=idx===0?16:48, sc=idx===0?.42:.8, yy=idx===0?370:400, span=idx===0?520:760;
      const scroll=s*isp, k0=Math.floor(scroll/span)-1;
      for(let k=k0;k<k0+Math.ceil(W/span)+3;k++){ if(h2(k,50+idx)<.25)continue;
        island(k*span-scroll+h2(k,60+idx)*200,yy+(h2(k,70+idx)-.5)*60+Math.sin(t*.6+k)*6,sc,P,idx===0?.55:.25,k*13+idx); }
    }
  });
}

/* ---------- scene 2: mountain ranges ---------- */
function sceneMountains(t,P,s){
  const snowAmt=lerp(.95,.15,sstep(8,15,t));
  let sc=s*10;
  const farY=x=>445-270*ridged((x+sc)*.0021,21);
  const farC=mix([104,124,168],P.haze,.5);
  const g=X.createLinearGradient(0,170,0,460); g.addColorStop(0,rgb(lite(farC,.1))); g.addColorStop(1,rgb(mix(farC,P.haze,.5)));
  X.fillStyle=g; ridgePath(farY); X.fill();
  X.save(); ridgePath(farY); X.clip();
  X.fillStyle=rgb(lite(P.haze,.75),snowAmt); X.beginPath(); X.moveTo(-10,-10);
  for(let x=-10;x<=W+10;x+=8) X.lineTo(x,262+34*noise((x+sc)*.012,5)+ (farY(x)<262?0:0));
  X.lineTo(W+10,-10); X.closePath(); X.fill(); X.restore();
  // haze band
  const hz=X.createLinearGradient(0,330,0,520); hz.addColorStop(0,rgb(P.haze,0)); hz.addColorStop(1,rgb(P.haze,.7)); X.fillStyle=hz; X.fillRect(0,330,W,190);
  // mid range with forest fringe
  sc=s*42;
  const midY=x=>548-175*fbm((x+sc)*.0032,31);
  const midC=mix(mix([58,92,84],P.vegDark,.35),P.haze,.4);
  X.fillStyle=rgb(midC); ridgePath(midY); X.fill();
  const tc=dark(midC,.12), k0=Math.floor(sc/13)-2;
  for(let k=k0;k<k0+W/13+4;k++){ const x=k*13-sc; const hh=12+h2(k,33)*14; pine(x,midY(x)+4,hh,tc,snowAmt*.2*(1-sstep(10,13,t))); }
  const hz2=X.createLinearGradient(0,470,0,640); hz2.addColorStop(0,rgb(P.haze,0)); hz2.addColorStop(1,rgb(P.haze,.45)); X.fillStyle=hz2; X.fillRect(0,470,W,170);
  // birds
  for(let i=0;i<7;i++){ const bx=wrap(300+i*38-s*14+Math.sin(i*2.1)*20,W+200)-100, by=250+Math.sin(i*1.7)*26+Math.sin(t*.8+i)*4; gull(bx,by,7,t*9+i,dark(midC,.3)); }
  // near ridge with deciduous trees
  sc=s*150;
  const nearY=x=>668-95*fbm((x+sc)*.004,41);
  X.fillStyle=rgb(dark(P.ground,.35)); ridgePath(nearY); X.fill();
  const tk0=Math.floor(sc/96)-2;
  for(let k=tk0;k<tk0+W/96+4;k++){ if(h2(k,44)<.3)continue; const x=k*96-sc+h2(k,45)*40;
    const c1=mix(P.veg,dark(P.veg,.25),h2(k,46)*.6), c2=P.vegDark; roundTree(x,nearY(x)+18,52+h2(k,47)*44,c1,c2,k); }
}

/* ---------- scene 3: summer sea ---------- */
function cumulus(x,y,s,P,seed){
  const lt=lite(P.skyBot,.6), sh=mix([190,200,225],P.haze,.45);
  for(let pass=0;pass<2;pass++){ X.fillStyle=rgb(pass?lt:sh);
    for(let j=0;j<12;j++){ const cx=x+(h2(seed,j)-.5)*170*s*(1-j/16), cy=y-j*20*s-h2(seed,j+20)*24*s, r=(64-j*3.2)*s;
      if(pass) circle(cx-r*.12,cy-r*.2,r*.78); else circle(cx,cy,r); } }
}
function sceneSea(t,P,s){
  const hor=450;
  let sc=s*6;
  for(let k=Math.floor(sc/520)-1;k<Math.floor(sc/520)+4;k++){ cumulus(k*520-sc+h2(k,80)*160,hor-8,.75+h2(k,81)*.6,P,k*7); }
  const sg=X.createLinearGradient(0,hor,0,H); sg.addColorStop(0,rgb(mix(P.haze,P.water,.45))); sg.addColorStop(.35,rgb(P.water)); sg.addColorStop(1,rgb(dark(P.water,.4)));
  X.fillStyle=sg; X.fillRect(0,hor,W,H-hor);
  // far islands
  sc=s*22;
  for(let k=Math.floor(sc/700)-1;k<Math.floor(sc/700)+3;k++){ if(h2(k,90)<.3)continue; const x=k*700-sc+h2(k,91)*300, w=120+h2(k,92)*140, hh=26+h2(k,93)*30;
    const ic=mix(P.vegDark,P.haze,.55); X.fillStyle=rgb(ic); X.beginPath(); X.moveTo(x-w,hor+1); X.quadraticCurveTo(x-w*.3,hor-hh*1.6,x,hor-hh); X.quadraticCurveTo(x+w*.4,hor-hh*.8,x+w,hor+1); X.closePath(); X.fill(); }
  // sun glitter
  const sx=P.sunX;
  for(let i=0;i<70;i++){ const q=i/70, y=hor+3+q*q*265, w=8+q*90;
    const f=hash(i*3.1+Math.floor(t*9)*17.3); if(f<.35)continue;
    X.fillStyle=rgb(lite(P.sun,.3),(.15+.55*f)*(1-q*.6)*P.sunA); X.fillRect(sx-w*.5+(hash(i+Math.floor(t*6))-.5)*w*.8,y,w*(.2+.4*f),1.5+q*3); }
  // wave rows
  const wc=lite(P.water,.35);
  for(let r=0;r<20;r++){ const q=(r+1)/20, y=hor+6+q*q*262, sp=12+q*q*420, spacing=26+q*150, len=5+q*48;
    X.strokeStyle=rgb(wc,.18+.35*q); X.lineWidth=.8+q*2.4;
    const scr=s*sp, k0=Math.floor(scr/spacing)-1;
    X.beginPath();
    for(let k=k0;k<k0+W/spacing+3;k++){ const x=k*spacing-scr+(h2(k+r*97,9)-.5)*spacing*.8, yy=y+Math.sin(t*2+k)*q*3;
      X.moveTo(x-len,yy); X.quadraticCurveTo(x,yy-len*.18,x+len,yy); }
    X.stroke(); }
  // sailboats
  [[.28,900,95],[.55,1300,210]].forEach(([q,span,sp],j)=>{ const scr=s*sp, y=hor+6+q*q*262+q*20;
    for(let k=Math.floor(scr/span)-1;k<Math.floor(scr/span)+3;k++){ const x=k*span-scr+h2(k,100+j)*300, z=.6+q*1.6;
      X.fillStyle=rgb(dark(P.water,.5)); X.beginPath(); X.moveTo(x-22*z,y); X.lineTo(x+22*z,y); X.lineTo(x+15*z,y+7*z); X.lineTo(x-15*z,y+7*z); X.fill();
      X.fillStyle=rgb(lite(P.sun,.4)); X.beginPath(); X.moveTo(x,y-2); X.lineTo(x,y-44*z); X.lineTo(x+20*z,y-4); X.fill();
      X.fillStyle=rgb(mix(lite(P.sun,.2),P.haze,.3)); X.beginPath(); X.moveTo(x-2,y-40*z); X.lineTo(x-2,y-4); X.lineTo(x-16*z,y-4); X.fill(); } });
  // gulls
  for(let i=0;i<9;i++){ const d=.4+h2(i,110)*1.1, bx=wrap(h2(i,111)*1600-s*(40+d*70),1600)-160, by=150+h2(i,112)*260+Math.sin(t*1.3+i)*10*d;
    gull(bx,by,9*d,t*(7+d*3)+i*2,dark(P.haze,.55)); }
}

/* ---------- scene 4: autumn town at dusk ---------- */
function sceneTown(t,P,s){
  let sc=s*12;
  X.fillStyle=rgb(mix([96,72,112],P.haze,.5)); ridgePath(x=>478-100*fbm((x+sc)*.0026,61)); X.fill();
  const hz=X.createLinearGradient(0,380,0,560); hz.addColorStop(0,rgb(P.haze,0)); hz.addColorStop(1,rgb(P.haze,.55)); X.fillStyle=hz; X.fillRect(0,380,W,180);
  // town
  sc=s*46; const base=566, span=46, lit=sstep(24,28.5,t);
  const bc=mix([64,46,72],P.haze,.28), rc=dark(bc,.25), roofSnow=sstep(30,31.6,t);
  X.fillStyle=rgb(bc); X.fillRect(0,base-4,W,H-base);
  for(let k=Math.floor(sc/span)-2;k<Math.floor(sc/span)+W/span+3;k++){
    const x=k*span-sc, w=28+h2(k,70)*14, hh=34+h2(k,71)*62, pagoda=wrap(k,23)===7;
    if(pagoda){ const tiers=5; X.fillStyle=rgb(bc);
      for(let i=0;i<tiers;i++){ const y=base-i*30, ww=40-i*5; X.fillRect(x-ww*.45,y-26,ww*.9,26);
        X.fillStyle=rgb(rc); X.beginPath(); X.moveTo(x-ww,y-22); X.quadraticCurveTo(x,y-38,x+ww,y-22); X.lineTo(x+ww*.8,y-30); X.lineTo(x-ww*.8,y-30); X.fill();
        if(roofSnow>0){X.fillStyle=rgb([236,240,250],roofSnow); X.fillRect(x-ww*.75,y-33,ww*1.5,4);} X.fillStyle=rgb(bc); }
      X.strokeStyle=rgb(rc); X.lineWidth=3; X.beginPath(); X.moveTo(x,base-150); X.lineTo(x,base-185); X.stroke(); continue; }
    X.fillStyle=rgb(mix(bc,rc,h2(k,72)*.6)); X.fillRect(x-w/2,base-hh,w,hh);

/* ---------- particles: petals, leaves, snow ---------- */
function mk(n,f){const a=[];for(let i=0;i<n;i++)a.push(f(i));return a;}
const PETALS=mk(80,()=>({x:rng()*1500,y:rng()*900,d:.4+rng()*1.2,vy:22+rng()*30,sw:10+rng()*26,sf:.8+rng()*1.6,ph:rng()*TAU,rot:rng()*TAU,rs:(rng()-.5)*5,fs:1.5+rng()*3,f:rng(),c:rng()}));
const LEAVES=mk(120,()=>({x:rng()*1500,y:rng()*900,d:.45+rng()*1.15,vy:40+rng()*45,sw:18+rng()*40,sf:.6+rng()*1.4,ph:rng()*TAU,rot:rng()*TAU,rs:(rng()-.5)*6,fs:1.2+rng()*3.4,f:rng(),c:Math.floor(rng()*6),type:rng()<.7?0:1}));
const SNOW=mk(340,()=>({x:rng()*1500,y:rng()*900,d:.3+rng()*1.4,vy:34+rng()*50,sw:6+rng()*18,sf:.5+rng()*1.5,ph:rng()*TAU,f:rng()}));
const LEAFCOL=[[214,64,38],[232,112,40],[242,172,52],[188,46,34],[208,142,48],[160,40,44]];
const MAPLE=(()=>{const p=new Path2D();for(let i=0;i<=120;i++){const th=i/120*TAU, r=.5+.5*Math.pow(Math.abs(Math.sin(th*2.5)),.8); const x=Math.sin(th)*r, y=-Math.cos(th)*r; i?p.lineTo(x,y):p.moveTo(x,y);} p.closePath(); return p;})();
const OVAL=(()=>{const p=new Path2D(); p.moveTo(0,-1); p.quadraticCurveTo(.75,-.2,0,1); p.quadraticCurveTo(-.75,-.2,0,-1); p.closePath(); return p;})();

const petalWind=t=>70*t+30*Math.sin(.5*t);
const leafWind=t=>150*t+170*Math.sin(.45*t+1)+50*Math.sin(1.3*t);
const snowWind=t=>45*t+40*Math.sin(.3*t)+700*sstep(30.8,33.4,t);
function pPos(p,t,wind,s){ const x=wrap(p.x-wind*p.d-s*30*p.d,1500)-110; const y=wrap(p.y+p.vy*p.d*t+p.sw*Math.sin(t*p.sf+p.ph),900)-90; return [x,y]; }

function drawParticles(t,P,s,front){
  const pa=1-sstep(8.5,11,t), la=sstep(20,22.5,t)*(1-sstep(29,30.8,t)), sa=sstep(30,31.6,t);
  if(pa>0){ const w=petalWind(t); for(const p of PETALS){ if((p.d>1)!==front)continue; const a=clamp((pa-p.f)/.12,0,1); if(a<=0)continue;
    const [x,y]=pPos(p,t,w,s), sz=4*p.d+1.5, fl=Math.cos(t*p.fs+p.ph);
    ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot+t*p.rs); ctx.scale(sz*(Math.abs(fl)*.8+.2),sz*.62);
    ctx.fillStyle=rgb(mix([255,196,214],[255,226,236],p.c),a*.95); ctx.beginPath(); ctx.arc(0,0,1,0,TAU); ctx.fill(); ctx.restore(); } }
  if(la>0){ const w=leafWind(t); for(const p of LEAVES){ if((p.d>1.05)!==front)continue; const a=clamp((la-p.f)/.12,0,1); if(a<=0)continue;
    const [x,y]=pPos(p,t,w,s), sz=(7+p.d*9)*(p.type?.8:1), fl=Math.cos(t*p.fs+p.ph);
    let col=LEAFCOL[p.c]; if(fl<0) col=dark(col,.28); col=mix(col,P.light,P.lightA*.6);
    ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot+t*p.rs); ctx.scale(sz*(fl<0?-1:1)*Math.max(.1,Math.abs(fl)),sz);
    ctx.fillStyle=rgb(col,a); ctx.fill(p.type?OVAL:MAPLE);
    ctx.strokeStyle=rgb(dark(col,.35),a); ctx.lineWidth=.09; ctx.beginPath(); ctx.moveTo(0,-.7); ctx.lineTo(0,1.25); ctx.stroke();
    ctx.restore(); } }
  if(sa>0){ const w=snowWind(t); for(const p of SNOW){ if((p.d>1.2)!==front)continue; const a=clamp((sa-p.f)/.1,0,1); if(a<=0)continue;
    const [x,y]=pPos(p,t,w,s), r=.8+p.d*2.1;
    ctx.fillStyle=rgb([240,246,255],a*(front?.7:.9)); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); } }
}

/* ---------- hero: a child riding a red-crowned crane ---------- */
function wing(g,a,far){
  const s=Math.sin(a), c=Math.cos(a), dy=far?-8*c:26*c;
  const S1=[34,-14], S2=[-32,-8];
  const E=[2-12*c,-16-92*s+dy*.5], T=[-64-56*c,-20-182*s+dy], TB=[-104-32*c,-10-150*s+dy*.9], M=[-62,-8-66*s+dy*.5];
  const base=far?[200,205,216]:[250,250,252];
  g.fillStyle=rgb(base);
  g.beginPath(); g.moveTo(S1[0],S1[1]);
  g.quadraticCurveTo(S1[0]+8,(S1[1]+E[1])/2,E[0],E[1]);
  g.quadraticCurveTo((E[0]+T[0])/2+14,(E[1]+T[1])/2-6*(s>=0?1:-1),T[0],T[1]);
  g.lineTo(TB[0],TB[1]); g.quadraticCurveTo(M[0]-10,M[1]+6,S2[0],S2[1]); g.closePath(); g.fill();
  // black trailing flight feathers
  const L=(p,q,k)=>[lerp(p[0],q[0],k),lerp(p[1],q[1],k)];
  const i1=L(TB,E,.16), i2=L(M,E,.18), i3=L(S2,E,.14);
  g.fillStyle=far?'rgb(24,24,30)':'rgb(30,30,38)';
  g.beginPath(); g.moveTo(T[0],T[1]); g.lineTo(TB[0],TB[1]); g.quadraticCurveTo(M[0]-10,M[1]+6,S2[0],S2[1]); g.lineTo(i3[0],i3[1]); g.quadraticCurveTo(i2[0],i2[1],i1[0],i1[1]); g.closePath(); g.fill();
  g.strokeStyle=far?'rgb(24,24,30)':'rgb(30,30,38)'; g.lineWidth=3; g.lineCap='round';
  for(let i=0;i<4;i++){ const k=.08+i*.07, p=L(T,TB,k); g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(p[0]-14-i*2,p[1]+(s>=0?-4:4)+i*3); g.stroke(); }
}

/* ---------- transitions between landscapes ---------- */
function fogPuffs(t,e,col,front,seed){
  if(!front){ ctx.fillStyle=rgb(col,e*.9); ctx.fillRect(0,0,W,H); }
  for(let i=0;i<28;i++){ const hv=h2(i,seed); if(front&&hv<.55)continue;
    const x=wrap(h2(i,seed+1)*1900-t*(700+hv*700),1900)-300, y=h2(i,seed+2)*H, r=140+hv*220;
    const g=ctx.createRadialGradient(x,y,0,x,y,r); const a=e*(front?.5:.85);
    g.addColorStop(0,rgb(col,a)); g.addColorStop(1,rgb(col,0)); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2); }
}
function transitions(t,P,front){
  let e=bump(t,8,1.5); if(e>0) fogPuffs(t,e,lite(P.haze,.6),front,300);
  e=bump(t,16,1.4); if(e>0){ if(!front){ const g=ctx.createRadialGradient(P.sunX,P.sunY,0,P.sunX,P.sunY,300+1500*e);
      g.addColorStop(0,rgb([255,250,232],e)); g.addColorStop(1,rgb([255,244,215],e*.82)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    else { ctx.fillStyle=rgb([255,250,232],e*.42); ctx.fillRect(0,0,W,H); } }
  e=bump(t,24,1.5); if(e>0) fogPuffs(t,e,[255,212,176],front,400);
  e=bump(t,32,1.5); if(e>0){ fogPuffs(t,e*.95,[222,230,246],front,500);
    ctx.strokeStyle=rgb([250,252,255],e*(front?.5:.7)); ctx.lineWidth=front?2:1.2; ctx.beginPath();
    for(let i=0;i<90;i++){ if(front!==(i%3===0))continue; const x=wrap(h2(i,510)*1500-t*1400,1500)-100, y=wrap(h2(i,511)*800+t*260,800)-40; ctx.moveTo(x,y); ctx.lineTo(x+46,y-9); }
    ctx.stroke(); }
}

/* ---------- captions & finish ---------- */
const SEASONS=[[.4,'春','SPRING'],[10.3,'夏','SUMMER'],[20.3,'秋','AUTUMN'],[30.3,'冬','WINTER']];
function captions(t){
  ctx.textBaseline='alphabetic';
  for(const [s0,k,en] of SEASONS){ const a=sstep(s0,s0+.8,t)*(1-sstep(s0+2.6,s0+3.4,t)); if(a<=0)continue;
    ctx.fillStyle=rgb([255,255,255],a*.9); ctx.font='600 46px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif'; ctx.fillText(k,60,104);
    ctx.fillStyle=rgb([255,255,255],a*.7); ctx.font='500 13px system-ui,sans-serif'; ctx.fillText(en.split('').join(' '),60,128); }
  const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95); const va=.28+.35*sstep(36.5,40,t);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,`rgba(0,0,10,${va})`); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  const e=sstep(37.2,39.2,t);
  if(e>0){ const band=ctx.createLinearGradient(0,H-230,0,H); band.addColorStop(0,'rgba(4,8,24,0)'); band.addColorStop(1,`rgba(4,8,24,${.6*e})`); ctx.fillStyle=band; ctx.fillRect(0,H-230,W,230);
    ctx.textAlign='center'; ctx.fillStyle=rgb([255,255,255],e*.9); ctx.font='500 34px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
    ctx.fillText('空の四季',W/2,H-92); ctx.font='500 13px system-ui,sans-serif'; ctx.fillStyle=rgb([255,255,255],e*.65); ctx.fillText('F I N',W/2,H-64); ctx.textAlign='left'; }
}

/* ---------- frame ---------- */
function render(t){
  t=clamp(t,0,D);
  const P=palette(t), s=camT(t);
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  drawSky(t,P);
  // scene blend: the incoming scene fades in under cover of the transition
  let idx=0; while(idx<BOUNDS.length && t>=BOUNDS[idx]+.4) idx++;
  const next=idx<BOUNDS.length?idx+1:-1;
  const w=next>0?sstep(BOUNDS[idx]-.4,BOUNDS[idx]+.4,t):0;
  X=ctx; SCENES[idx](t,P,s);
  if(w>0){ lctx.setTransform(1,0,0,1,0,0); lctx.clearRect(0,0,W,H); X=lctx; SCENES[next](t,P,s); X=ctx;
    ctx.globalAlpha=w; ctx.drawImage(layer,0,0); ctx.globalAlpha=1; }
  drawParticles(t,P,s,false);
  transitions(t,P,false);
  const hero=drawHero(t,P);
  streaks(t,P,s,hero);
  drawParticles(t,P,s,true);
  transitions(t,P,true);
  captions(t);
}

/* ---------- playback & recording API ---------- */
const btn=document.getElementById('play'), scrub=document.getElementById('scrub'), tc=document.getElementById('tc');
let cur=0, playing=true, base=null;
function ui(){ scrub.value=cur.toFixed(2); tc.textContent=cur.toFixed(2).padStart(5,'0')+' / 40.00'; btn.textContent=playing?'一時停止':(cur>=D?'もう一度':'再生'); }
function loop(now){ if(!playing)return; if(base===null) base=now-cur*1000; cur=Math.min(D,(now-base)/1000); render(cur);
  if(cur>=D){ playing=false; } ui(); if(playing) requestAnimationFrame(loop); }
window.setTime=function(t){ playing=false; base=null; cur=clamp(+t||0,0,D); render(cur); ui(); };
btn.addEventListener('click',()=>{ if(playing){ playing=false; ui(); return; } if(cur>=D) cur=0; playing=true; base=null; ui(); requestAnimationFrame(loop); });
scrub.addEventListener('input',()=>{ playing=false; base=null; cur=+scrub.value; render(cur); ui(); });
render(0); ui(); requestAnimationFrame(loop);
})();
</script>
