<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="te1 de1">
  <title id="te1">React フロントエンドと5つのバックエンド構成パターン</title>
  <desc id="de1">PCF、Code Apps、Web API、Supabase、Azure PostgreSQL の接続先と Entra ID 認証基盤の位置関係</desc>
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#0f172a">5つの構成パターンと Entra ID 認証基盤</text>
  <g font-family="system-ui,sans-serif">
    <rect x="256" y="48" width="208" height="38" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
    <text x="360" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">React フロントエンド</text>

    <rect x="16" y="132" width="130" height="76" rx="9" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.8"/>
    <text x="81" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">E1 PCF</text>
    <text x="81" y="172" text-anchor="middle" font-size="10.5" fill="#475569">Power Apps</text>
    <text x="81" y="188" text-anchor="middle" font-size="10.5" fill="#475569">コンポーネント</text>

    <rect x="154" y="132" width="130" height="76" rx="9" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.8"/>
    <text x="219" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">E2 Code Apps</text>
    <text x="219" y="172" text-anchor="middle" font-size="10.5" fill="#475569">Power Platform</text>
    <text x="219" y="188" text-anchor="middle" font-size="10.5" fill="#475569">上でホスト</text>

    <rect x="292" y="132" width="130" height="76" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="357" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">E3 Web API</text>
    <text x="357" y="172" text-anchor="middle" font-size="10.5" fill="#475569">中間層 +</text>
    <text x="357" y="188" text-anchor="middle" font-size="10.5" fill="#475569">PostgreSQL</text>

    <rect x="430" y="132" width="130" height="76" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
    <text x="495" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">E4 Supabase</text>
    <text x="495" y="172" text-anchor="middle" font-size="10.5" fill="#475569">マネージド</text>
    <text x="495" y="188" text-anchor="middle" font-size="10.5" fill="#475569">PostgreSQL + RLS</text>

    <rect x="568" y="132" width="136" height="76" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="636" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">E5 Azure</text>
    <text x="636" y="172" text-anchor="middle" font-size="10.5" fill="#475569">PostgreSQL</text>
    <text x="636" y="188" text-anchor="middle" font-size="10.5" fill="#475569">フルマネージド</text>

    <g stroke="#94a3b8" stroke-width="1.6" fill="none">
      <path d="M300 86 L81 128" marker-end="url(#ae1)"/>
      <path d="M330 86 L219 128" marker-end="url(#ae1)"/>
      <path d="M360 86 L357 128" marker-end="url(#ae1)"/>
      <path d="M390 86 L495 128" marker-end="url(#ae1)"/>
      <path d="M420 86 L636 128" marker-end="url(#ae1)"/>
    </g>

    <rect x="180" y="240" width="360" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/>
    <text x="360" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">Microsoft Entra ID（認証基盤）</text>
    <text x="360" y="275" text-anchor="middle" font-size="10.5" fill="#6d28d9">全パターン共通で ID とアクセス制御を担う</text>
    <g stroke="#a78bfa" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
      <path d="M81 208 L300 240"/>
      <path d="M219 208 L330 240"/>
      <path d="M357 208 L360 240"/>
      <path d="M495 208 L400 240"/>
      <path d="M636 208 L430 240"/>
    </g>

    <text x="360" y="304" text-anchor="middle" font-size="10.5" fill="#94a3b8">出典: Microsoft Learn（記事内 primarySources 参照）</text>
  </g>
  <defs>
    <marker id="ae1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
