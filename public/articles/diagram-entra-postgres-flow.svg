    <path d="M388 228 L388 184" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#ap3)"/>
    <text x="404" y="212" font-size="10" fill="#b45309">Graph API</text>
    <text x="240" y="112" font-size="10" fill="#7c3aed">認証</text>

    <text x="360" y="306" text-anchor="middle" font-size="10.5" fill="#94a3b8">出典: Microsoft Learn（記事内 primarySources 参照）</text>
