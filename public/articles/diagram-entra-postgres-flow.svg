<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="tp1 dp1">
  <title id="tp1">E3 Entra ID + PostgreSQL 構成の認証・データフロー</title>
  <desc id="dp1">社員がブラウザから React にアクセスし Entra ID で認証、中間層を経由して PostgreSQL と AI API に接続。社内データソースは Graph API で接続</desc>
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#0f172a">E3 Entra ID + PostgreSQL 構成の全体フロー</text>
  <g font-family="system-ui,sans-serif">
    <rect x="20" y="120" width="112" height="60" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="76" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">社員</text>
    <text x="76" y="163" text-anchor="middle" font-size="10.5" fill="#1e40af">ブラウザ</text>

    <rect x="164" y="120" width="128" height="60" rx="9" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="228" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">React</text>
    <text x="228" y="163" text-anchor="middle" font-size="10.5" fill="#475569">フロントエンド</text>

    <rect x="164" y="42" width="128" height="46" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="228" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Entra ID</text>
    <text x="228" y="79" text-anchor="middle" font-size="10.5" fill="#6d28d9">認証・トークン発行</text>

    <rect x="324" y="120" width="128" height="60" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="388" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">中間層 API</text>
    <text x="388" y="163" text-anchor="middle" font-size="10.5" fill="#475569">認可・業務ロジック</text>

    <rect x="484" y="76" width="128" height="54" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="548" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PostgreSQL</text>
    <text x="548" y="116" text-anchor="middle" font-size="10.5" fill="#475569">業務データ</text>

    <rect x="484" y="170" width="128" height="54" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="548" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">AI API</text>
    <text x="548" y="210" text-anchor="middle" font-size="10.5" fill="#475569">推論</text>

    <rect x="164" y="228" width="288" height="56" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="308" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">社内データソース</text>
    <text x="308" y="266" text-anchor="middle" font-size="10.5" fill="#78350f">SharePoint / OneDrive / Teams</text>

    <g stroke="#94a3b8" stroke-width="1.8" fill="none">
      <path d="M132 150 L161 150" marker-end="url(#ap1)"/>
      <path d="M292 150 L321 150" marker-end="url(#ap1)"/>
      <path d="M452 140 L481 112" marker-end="url(#ap1)"/>
      <path d="M452 160 L481 188" marker-end="url(#ap1)"/>
    </g>
    <g stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-dasharray="4 3">
      <path d="M228 120 L228 90" marker-end="url(#ap2)"/>
