name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 公開の直前に置く関門。ここが落ちれば deploy まで進まないため、
      # 個人情報や環境固有の情報を含んだまま公開されることはない。
      - name: 個人情報・環境固有情報チェック（記事データ）
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node scripts/check-private-info.mjs

      # Cloudflare Web Analytics のサイト識別子を build 時に注入する。
      # Secret 未設定なら空文字になり、src/analytics.js が beacon を
      # 一切読み込まない（＝ 外部通信ゼロ）ため、未設定のままでも安全。
      # この値は公開サイト識別子であり認証情報ではない（CLAUDE.md 参照）。
      - run: npm run build
        env:
          VITE_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}

      # ビルド成果物にも同じ検査をかける。記事データを経由しない経路
      # （コンポーネント等）から混入した場合を捕まえる。
      - name: 個人情報・環境固有情報チェック（ビルド成果物）
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node scripts/check-private-info.mjs --dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
