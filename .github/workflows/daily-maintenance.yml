name: Daily maintenance

# 判断が要らない検査だけを毎日走らせる。
# ニュース調査と記事執筆は言語モデルが要るため、ここでは行わない（Routine 側）。
# 公開リポジトリなので Actions の実行時間は無料、外部 API も鍵も使わない。

on:
  schedule:
    # 記事作成 Routine（07:00 / 15:00 JST）の直前に置く。
    # 先に点検が回っていれば、消失や期限切れを抱えたまま記事が
    # 積み上がるのを防げる。
    # 毎時ちょうどは GitHub 側が混んで遅延しやすいため分をずらす。
    - cron: "40 21 * * *"   # 06:40 JST
    - cron: "40 5 * * *"    # 14:40 JST
  workflow_dispatch:

permissions:
  # マージ済みの作業ブランチを削除するため write が要る。
  # 削除対象は routine/ 接頭辞かつ「記事 id が全部 main にある」ものだけで、
  # main や claude/* には触れない（check-stale-branches.mjs 側で二重に確認）。
  contents: write
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      # 棚卸しが他ブランチの articlesMeta.js を読むため、全 ref を取る
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 通知の周期を分ける。検知を足すほど1つの Issue に性質の違うものが
      # 混ざり、急ぎのものが埋もれる。実際、日次の報告にガイドの指摘28件が
      # 並んでいた。**検知を増やすことより、周期を分けるほうが効く。**
      - name: 周期を決める
        id: scope
        run: |
          DOW=$(TZ=Asia/Tokyo date +%u)   # 1=月
          DOM=$(TZ=Asia/Tokyo date +%d)
          echo "daily=true" >> "$GITHUB_OUTPUT"
          [ "$DOW" = "1" ] && echo "weekly=true" >> "$GITHUB_OUTPUT" || echo "weekly=false" >> "$GITHUB_OUTPUT"
          [ "$DOM" = "01" ] && echo "monthly=true" >> "$GITHUB_OUTPUT" || echo "monthly=false" >> "$GITHUB_OUTPUT"

      - name: 点検レポートを作る（日次）
        id: report
        run: |
          node scripts/maintenance-report.mjs --scope=daily > /tmp/report.md
          echo "--- レポート内容 ---"
          cat /tmp/report.md

      - name: 点検レポートを作る（週次・月曜）
        id: report_weekly
        if: steps.scope.outputs.weekly == 'true'
        run: |
          node scripts/maintenance-report.mjs --scope=weekly > /tmp/report-weekly.md
          cat /tmp/report-weekly.md

      - name: 点検レポートを作る（月次・1日）
        id: report_monthly
        if: steps.scope.outputs.monthly == 'true'
        run: |
          node scripts/maintenance-report.mjs --scope=monthly > /tmp/report-monthly.md
          cat /tmp/report-monthly.md

      # 点検が動いた証跡を残す。ワークフローは自分が動かなかったことを
      # 検知できないため、**別のスケジューラ（Claude Routine）がこれを見る。**
      # 日付だけなので、1日2回走ってもコミットは1日1回に収まる。
      - name: 心拍を更新する
        run: |
          node scripts/check-maintenance-heartbeat.mjs --write \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if ! git diff --quiet scripts/maintenance-heartbeat.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/maintenance-heartbeat.json
            git commit -m "chore: 点検の心拍を更新"
            git push origin HEAD:main || echo "心拍の push に失敗しました（次回に持ち越します）"
          fi

      # Routine は1日2回走り、一次ソースに到達できなかった記事をブランチに
      # 退避する。退避は正しい判断だが、ブランチは誰も消さない。放置すると
      # 月60本のペースで増え、開いた PR が並び続けることで通知そのものが
      # 無視されるようになる。
      #
      # 消すのは「ブランチ上の記事 id が全部 main にある」ものだけ。
      # squash merge では元コミットが main の履歴に残らないため、
      # コミットの到達性ではなく記事の中身で判定する。日付では判定しない。
      #
      # 未決着の下書きはここでは絶対に消さない。保留理由の大半は実行環境の
      # egress であって記事の欠陥ではなく、到達可否は日によって変わる。
      # 時間で消すと、検証できるようになった瞬間に捨てることになる。
      - name: マージ済みの作業ブランチを削除する
        continue-on-error: true
        run: |
          node scripts/check-stale-branches.mjs --json > /tmp/branches.json
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("/tmp/branches.json", "utf8"));
            // 接頭辞をここでも確認する。棚卸し側と二重にすることで、
            // 片方が壊れても main や claude/* を消さない。
            const safe = d.merged.map(m => m.branch).filter(b => b.startsWith("routine/"));
            // **末尾に改行を付ける。** 付けないと `while IFS= read -r` が最後の1行を
            // 読み飛ばす。2026年9月5日の初回実行で実際に起き、削除対象2本のうち
            // 1本だけが消えた。
            fs.writeFileSync("/tmp/delete.txt", safe.length ? safe.join("\n") + "\n" : "");
            console.log(safe.length ? `削除対象 ${safe.length} 本:\n` + safe.join("\n") : "削除対象はありません。");
          '
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            case "$b" in
              routine/*) ;;
              *) echo "接頭辞が違うため飛ばします: $b"; continue ;;
            esac
            echo "削除: $b"
            git push origin --delete "$b" || echo "  削除に失敗しました（既に無い可能性）"
          done < /tmp/delete.txt

      # 「異常なし」を毎日 Issue に出すと通知が無視されるようになるため、
      # 報告すべきことがある場合だけ Issue を立てる。
      # 同じ内容の Issue が積み上がらないよう、開いている当日分があれば更新する。
      # 周期ごとに別の Issue にする。同じ Issue に混ぜると、月次の棚卸しが
      # 日次の指摘に埋もれる。**分けた意味が無くなる。**
      # 同じ周期の当日ぶんが既に開いていれば更新する（重複を積み上げない）。
      - name: 必要なときだけ Issue を立てる
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const today = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
            }).format(new Date());

            const jobs = [
              { file: "/tmp/report.md",         label: "日次", ok: "${{ steps.report.outputs.actionable }}" },
              { file: "/tmp/report-weekly.md",  label: "週次", ok: "${{ steps.report_weekly.outputs.actionable }}" },
              { file: "/tmp/report-monthly.md", label: "月次", ok: "${{ steps.report_monthly.outputs.actionable }}" },
            ];

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "maintenance", per_page: 50,
            });

            for (const j of jobs) {
              if (j.ok !== "true") continue;
              if (!fs.existsSync(j.file)) continue;
              const body = fs.readFileSync(j.file, "utf-8");
              const title = `${j.label}点検: 対応が必要な項目があります（${today}）`;
              const existing = open.find((i) => i.title === title);
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body,
                });
                core.notice(`${j.label}: 既存の Issue #${existing.number} を更新しました。`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: ["maintenance"],
                });
                core.notice(`${j.label}: Issue #${created.number} を作成しました。`);
              }
            }

  # 出典 URL の到達性は週1回。930件あり毎日叩くと相手側に負荷をかける。
  # agent の実行環境と違い Actions はネットワーク制限が無いため、
  # ここで走らせたほうが判定不能が減る。
  source-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: 月曜だけ実行する
        id: gate
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "月曜ではないため省略します。"
          fi

      # DEAD（404 / 410 / 名前解決失敗）だけがエラー。
      # 403・429・5xx は判定不能として扱う。これを「リンク切れ」と見なして
      # 機械的に削除すると、正しい出典を失う。
      #
      # continue-on-error だけだとジョブが success になり、到達できない URL が
      # ログに埋もれる。初回の実行で17件が実際に埋もれたため、件数を出力に取り、
      # 1件でもあれば Issue にする。
      - name: 出典 URL の到達性
        if: steps.gate.outputs.run == 'true'
        id: urls
        run: |
          node scripts/check-source-urls.mjs --json --concurrency=4 --timeout=20000 > /tmp/urls.json || true
          node -e '
            const fs = require("fs");
            let data;
            try {
              data = JSON.parse(fs.readFileSync("/tmp/urls.json", "utf8"));
            } catch (e) {
              console.log("JSON を読めませんでした: " + e.message);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "dead=unknown\n");
              process.exit(0);
            }
            const r = data.results || [];
            const n = (s) => r.filter((x) => x.status === s).length;
            console.log(`全 ${r.length} 件 — OK ${n("OK")} / 判定不能 ${n("INDETERMINATE")} / サーバ障害 ${n("SERVER_ERROR")} / 到達不可 ${n("DEAD")}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `dead=${n("DEAD")}\n`);
          '

      # 404 の大半は「情報が消えた」のではなく「URL が変わった」だけである。
      # 出典を削除すれば記事の裏付けは薄くなるので、先に移転先を探す。
      # agent の実行環境はネットワークが絞られていて探索できないため、
      # 制限のないここで行う。候補は提示するだけで自動適用はしない。
      - name: 移転先の候補を探す
        if: steps.gate.outputs.run == 'true' && steps.urls.outputs.dead != '0' && steps.urls.outputs.dead != 'unknown'
        continue-on-error: true
        run: node scripts/find-moved-urls.mjs --from-json=/tmp/urls.json --json > /tmp/moved.json

      # 到達できない URL は記事の信頼性に直結するため、必ず表に出す。
      # ただし「到達できない」は「記事が間違っている」ことを意味しない。
      # 過去の実例では DEAD 2件がいずれも「実在する事柄に誤った URL が
      # 付いていた」ケースで、URL の差し替えだけで済んでいる。
      - name: 到達できない URL を Issue にする
        if: steps.gate.outputs.run == 'true' && steps.urls.outputs.dead != '0' && steps.urls.outputs.dead != 'unknown'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/urls.json", "utf8"));
            const dead = (data.results || []).filter((x) => x.status === "DEAD");
            const today = new Date().toISOString().slice(0, 10);

            const lines = [
              `## 到達できない出典 URL（${dead.length} 件）`,
              "",
              "**この一覧を根拠に記事を取り下げないでください。**",
              "DEAD が意味するのは「その URL が違う」ことだけです。過去の実例では、",
              "DEAD だった2件はいずれも実在する事柄に誤った URL が付いていたケースで、",
              "正しい URL に差し替えるだけで済みました。",
              "**対応を決める前に、必ず対象の事実そのものを外部で検証してください。**",
              "",
              "| URL | 状態 | 掲載記事 |",
              "|---|---|---|",
              ...dead.map((d) => `| ${d.url} | ${d.detail} | \`${d.where}\` |`),
              "",
              "---",
              "",
              "403・429・5xx は判定不能として除外しています。bot 対策で弾かれている",
              "だけの場合が多く、リンク切れとして機械的に削除すると正しい出典を失います。",
              "",
              `検査日: ${today} / \`daily-maintenance.yml\` が自動で作成しました。`,
            ];

            // 移転先の候補が見つかっていれば添える。
            // 404 の大半は情報が消えたのではなく URL が変わっただけであり、
            // 出典を削除する前に差し替えを検討できるようにする。
            try {
              const moved = JSON.parse(fs.readFileSync("/tmp/moved.json", "utf8"));
              const withCands = (moved.report || []).filter((r) => r.candidates?.length);
              if (withCands.length) {
                lines.push(
                  "",
                  `## 移転先の候補（${withCands.length} 件）`,
                  "",
                  "**自動では差し替えていません。** 「それらしい URL」を機械的に当てはめると、",
                  "実在しない出典を掲げる事故を繰り返します。内容を確認してから採否を決めてください。",
                  "",
                  "| 元の URL | 候補 | 確度 | 根拠 |",
                  "|---|---|---|---|",
                  ...withCands.flatMap((r) =>
                    r.candidates.map((c) => `| ${r.url} | ${c.url} | ${c.confidence} | ${c.how} |`)
                  ),
                  ""
                );
              }
              const none = (moved.report || []).length - withCands.length;
              if (none > 0) {
                lines.push("", `候補が見つからなかったものが ${none} 件あります。出典の削除を検討してください。`, "");
              }
            } catch {
              // 候補探索が走らなかった場合は本体だけを出す
            }

            const title = `出典 URL: 到達できないものが ${dead.length} 件あります（${today}）`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "maintenance",
              per_page: 20,
            });
            const existing = open.find((i) => i.title.startsWith("出典 URL:"));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body: lines.join("\n"),
              });
              core.notice(`既存の Issue #${existing.number} を更新しました。`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: lines.join("\n"),
                labels: ["maintenance"],
              });
              core.notice(`Issue #${created.number} を作成しました。`);
            }
